# mode: vanilla | hide | replace. Empty message hides it.
# Colors: &a, plus &#RRGGBB on 1.16+.
# Placeholders everywhere: {player}, {displayname}, {world}, {online}, {max}.
# PlaceholderAPI placeholders work if it is installed.

# Check Modrinth for updates on startup.
update-check: true

# No messages for players with sservermessages.silent.
silent:
  enabled: true
  # Also hide vanished players.
  hide-vanished: true

# Private greeting for the joining player.
welcome:
  enabled: false
  message:
    - "&7Привет, &e{player}&7! Добро пожаловать на сервер."
    - "&7Сейчас онлайн: &a{online}&7/&a{max}"

join:
  mode: replace
  message: "&e{player} &7зашёл на сервер"

quit:
  mode: replace
  message: "&e{player} &7вышел с сервера"

# Shown to other players. Placeholders: {reason}.
kick:
  mode: replace
  message: "&e{player} &7был кикнут с сервера: &c{reason}"

# Placeholders: {killer}, {cause}.
# Lookup order: player, mob, cause name, then message.
# Empty cause text hides it.
death:
  mode: replace
  message: "&c{player} &7погиб"
  causes:
    player: "&c{player} &7был убит игроком &c{killer}"
    mob: "&c{player} &7был убит существом &c{killer}"
    fall: "&c{player} &7разбился"
    fire: "&c{player} &7сгорел"
    fire_tick: "&c{player} &7сгорел"
    lava: "&c{player} &7сварился в лаве"
    drowning: "&c{player} &7утонул"
    void: "&c{player} &7упал в бездну"
    explosion: "&c{player} &7был взорван"
  # Names for {cause}.
  names:
    fall: "падение"
    fire: "огонь"
    fire_tick: "огонь"
    lava: "лава"
    drowning: "утопление"
    void: "бездна"
    entity_attack: "атака"
    projectile: "снаряд"
    suffocation: "удушье"
    starvation: "голод"
    contact: "кактус"
    block_explosion: "взрыв"
    entity_explosion: "взрыв"
    lightning: "молния"
    poison: "яд"
    magic: "магия"
    wither: "иссушение"
    unknown: "неизвестно"

# Placeholders: {advancement}.
# Replace/hide works on Paper and forks only.
advancement:
  mode: replace
  message: "&e{player} &7получил достижение &a{advancement}"

reload-message: "&aКонфигурация sServerMessages перезагружена."
error-message: "&cОшибка в config.yml, настройки не изменены. Подробности в консоли."
no-permission-message: "&cУ вас нет прав на эту команду."
