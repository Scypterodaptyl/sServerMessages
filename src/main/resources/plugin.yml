name: sServerMessages
main: com.scypter.sservermessages.SServerMessages
version: ${version}
author: ScypterV
description: Управление серверными сообщениями о входе, выходе, смерти, достижениях и кике.
api-version: 1.13
folia-supported: true
softdepend: [PlaceholderAPI]
commands:
  sservermessages:
    description: Управление sServerMessages
    usage: /sservermessages reload
    aliases: [ssm]
permissions:
  sservermessages.reload:
    description: Перезагрузка config.yml
    default: op
  sservermessages.silent:
    description: Вход, выход, смерть и достижения игрока без сообщений в чат
    default: false
